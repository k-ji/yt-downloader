<!DOCTYPE html>
<html>
<head>
<style>
  body {
    width: 320px;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    color: #1a1a1a;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-audio { background: #2563eb; color: white; }
  .btn-video { background: #16a34a; color: white; }
  .btn-folder { background: #6b7280; color: white; }
  .format-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .format-row label { font-size: 13px; color: #555; }
  .format-row select {
    flex: 1;
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  #status {
    margin-top: 12px;
    padding: 8px;
    border-radius: 4px;
    font-size: 13px;
    display: none;
  }
  .status-ok { background: #dcfce7; color: #166534; }
  .status-err { background: #fee2e2; color: #991b1b; }
  .status-wait { background: #fef3c7; color: #92400e; }
  #url {
    font-size: 12px;
    color: #888;
    word-break: break-all;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <h2>YT Downloader</h2>
  <div id="url">Loading...</div>
  <div class="format-row">
    <label>Format:</label>
    <select id="audioFmt">
      <option value="mp3">MP3</option>
      <option value="m4a">M4A</option>
      <option value="wav">WAV</option>
    </select>
  </div>
  <button class="btn btn-audio" id="dlAudio">Download Audio</button>
  <button class="btn btn-video" id="dlVideo">Download Video</button>
  <button class="btn btn-folder" id="openFolder" style="display:none">Open Folder</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
